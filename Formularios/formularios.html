<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    
<!-- Formularios HTML -->
 <form> <!-- Estrutura do formulario-->

<fieldset>
    <legend>Informações de Contato</legend>

    <br

    <label for="nome">Nome:</label> <!-- Indicação do input -->
    <input type="text" id="nome" name="nome" placeholder="Informe seu nome"> <!-- Campo de entrada-->

    <br>
    
    <label for="email">email:</label>
    <input type="email" id="email" name="email" placeholder="Informe seu email">

    <br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="Informe sua senha">

    <br>

    <label for="data">Data de nascimento:</label>
    <input type="date" id="data" name="data"

</fieldset>

 </form>

</body>
</html>
