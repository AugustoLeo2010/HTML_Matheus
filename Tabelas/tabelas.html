<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
<!-- TABELAS EM HTML -->
 
<h2>Trabalhando com tabelas</h2>
<table border="1">


 <thead> <!-- Cabeçalho -->
     
    <tr> <!-- Linha da tabela -->
    <th>Nome</th> <!-- Coluna-->
    <th>Idade</th> <!-- Coluna -->
    <th>CPF</tr> <!-- Coluna -->
    <th>E-mail</th> <!-- Coluna -->
    </tr>
    
 </thead> 

<!-- Corpo -->

<tbody>
 <tr> <!-- Linha da Tabela -->
   <td>Matheus</td> <!-- Item da Tabela-->
   <td>27</td> <!-- Item da Tabela-->
   <td>181.282.383.48</td> <!-- Item da Tabela-->
   <td>Matheus@gmail.com</td> <!-- Item da Tabela-->
 </tr>

</tbody>

</table>

<!-- Mesclando Colunas -->
<h2>trabalhando com tabelas</h2>
<table border="1">

<thead>
    
    <tr>
       <th colspan="4">Lista de Filmes</th>
    </tr>
    <tr>
        <th>Genero</th>
        <th>Ano</th>
        <th>Titulo</th>
        <th>Nota</th>
    </tr>


</thead>

<tbody>
  <tr>
    <td rowspan="2">Ação</td>
    <td>2019</td>
    <td>Vingadores Ultimato</td>
    <td>9.8</td>
  </tr>

  <tr>
    <td>2026</td>
    <td>John Wich</td>
    <td>10</td>
  </tr>

  <tr>
    <td rowspan="2">Comedia</td>
    <td>2005</td>
    <td>American pie</td>
    <td>10</td>
  </tr>

  <tr>
    <td>2007</td>
    <td>Super Bad</td>
    <td>7.6</td>
  </tr>
</tbody>

</table>


</body>
</html>

<!-- Table>thead+tbody (Atalho) -->
